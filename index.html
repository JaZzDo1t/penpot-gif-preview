<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF Preview</title>
<style>
  :root {
    --bg: #ffffff; --fg: #16161d; --dim: #6b6b76;
    --line: #e3e3e8; --panel: #f4f4f7; --accent: #7efff5; --accent-fg: #16161d;
  }
  body.dark {
    --bg: #18181a; --fg: #eaeaef; --dim: #9a9aa6;
    --line: #2e2e34; --panel: #101013; --accent: #7efff5; --accent-fg: #16161d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--fg);
    font: 13px/1.45 "Work Sans", -apple-system, system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; gap: 10px; height: 100vh;
  }
  .stage {
    flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    overflow: auto; padding: 10px;
  }
  /* «Вписать» — растягиваем и мелкие кадры, иначе логотип 150×64 не разглядеть */
  .stage img { display: block; width: 100%; height: auto; max-height: 100%; object-fit: contain; }
  .stage.actual img { width: auto; height: auto; max-width: none; max-height: none; }
  .hint { color: var(--dim); text-align: center; padding: 0 24px; }
  .hint b { color: var(--fg); font-weight: 500; display: block; margin-bottom: 6px; }

  .meta { display: flex; flex-direction: column; gap: 3px; }
  .meta .title { font-weight: 500; overflow-wrap: anywhere; }
  .meta .sub { color: var(--dim); font-size: 12px; }
  .meta .sub a { color: var(--dim); }
  .meta .sub a:hover { color: var(--fg); }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px;
    background: var(--accent); color: var(--accent-fg); margin-right: 6px;
  }
  .badge.flat { background: var(--line); color: var(--dim); }

  .bar { display: flex; gap: 6px; }
  button {
    flex: 1; padding: 7px 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--fg); border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
  }
  button:hover { border-color: var(--dim); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="hint" id="hint"><b data-t="idleTitle"></b><span data-t="idleText"></span></div>
</div>

<div class="meta" id="meta" hidden>
  <div class="title" id="mTitle"></div>
  <div class="sub" id="mSub"></div>
</div>

<div class="bar">
  <button id="bFit" aria-pressed="true" data-t="fit"></button>
  <button id="bActual" aria-pressed="false" data-t="actual"></button>
  <button id="bRestart" data-t="restart"></button>
</div>

<script>
const RU = navigator.language && navigator.language.toLowerCase().startsWith("ru");
const T = RU ? {
  idleTitle: "Ничего не выделено",
  idleText: "Выберите на холсте фигуру с картинкой — анимация пойдёт здесь.",
  noImageTitle: "У фигуры нет картинки",
  noImageText: "Нужна фигура с заливкой-изображением.",
  fit: "Вписать", actual: "1:1", restart: "Сначала",
  animated: "анимация", still: "статика", open: "открыть файл",
  failTitle: "Картинка не загрузилась",
  failText: "Не отвечает ни один адрес:"
} : {
  idleTitle: "Nothing selected",
  idleText: "Select a shape with an image fill — its animation plays here.",
  noImageTitle: "No image in this shape",
  noImageText: "Pick a shape that has an image fill.",
  fit: "Fit", actual: "1:1", restart: "Restart",
  animated: "animated", still: "still", open: "open file",
  failTitle: "Image did not load",
  failText: "No address responded:"
};
document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[e.dataset.t]);

// Penpot отдаёт медиа по адресу своего инстанса, и без авторизации — достаточно знать origin.
// Панель сидит во вложенном iframe: ближайший предок — песочница самого плагина,
// поэтому берём цепочку предков С КОНЦА (верхний = Penpot) и выбрасываем свой origin.
const ORIGINS = (() => {
  const list = [];
  const add = o => { if (o && o !== location.origin && list.indexOf(o) < 0) list.push(o); };
  try {
    const a = location.ancestorOrigins;
    if (a && a.length) for (let i = a.length - 1; i >= 0; i--) add(a[i]);
  } catch (e) {}
  try { if (document.referrer) add(new URL(document.referrer).origin); } catch (e) {}
  add("https://design.penpot.app");
  return list;
})();
const mediaUrl = (id, n) => ORIGINS[n] + "/assets/by-file-media-id/" + id;

const stage = document.getElementById("stage");
const hint = document.getElementById("hint");
const meta = document.getElementById("meta");
const mTitle = document.getElementById("mTitle");
const mSub = document.getElementById("mSub");
let current = null;

function showHint(title, text) {
  meta.hidden = true;
  stage.innerHTML = '<div class="hint"><b></b><span></span></div>';
  stage.querySelector("b").textContent = title;
  stage.querySelector("span").textContent = text;
  current = null;
}

// Что именно запретила политика безопасности — узнаём от браузера, а не гаданием
let violation = "";
document.addEventListener("securitypolicyviolation", e => {
  violation = e.violatedDirective + " ⟵ " + String(e.blockedURI).slice(0, 60);
});

function showImage(d) {
  current = d;
  const animated = /gif|webp|apng/i.test(d.mtype);
  const stamp = Date.now();               // свежий запрос — гифка стартует с первого кадра
  let n = 0;

  const img = new Image();
  img.alt = d.name || "";
  img.onload = () => { meta.hidden = false; describeFill(d, animated, img.dataset.src || img.src); };
  img.onerror = () => {
    if (++n < ORIGINS.length) { img.src = mediaUrl(d.id, n) + "?t=" + stamp; return; }
    viaFetch(d, img, animated);           // прямая загрузка не прошла — идём в обход
  };
  img.src = mediaUrl(d.id, 0) + "?t=" + stamp;

  stage.innerHTML = "";
  stage.appendChild(img);
}

// Обход 1: тянем байты сами и показываем как blob. Обход 2: просим фоновую часть плагина.
async function viaFetch(d, img, animated) {
  img.onerror = () => failed("данные не читаются");   // без этого обход зациклится сам на себя
  for (const o of ORIGINS) {
    const url = o + "/assets/by-file-media-id/" + d.id;
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const blob = await r.blob();
      img.dataset.src = url;
      img.src = URL.createObjectURL(blob);
      return;
    } catch (e) { /* следующий адрес */ }
  }
  pending = { d, img, animated };
  parent.postMessage({ type: "need-bytes", url: ORIGINS[0] + "/assets/by-file-media-id/" + d.id, mtype: d.mtype }, "*");
  setTimeout(() => { if (pending && pending.d === d) { pending = null; failed("ответа нет"); } }, 5000);
}

let pending = null;
function failed(extra) {
  const why = violation ? " · " + violation : (extra ? " · " + extra : "");
  showHint(T.failTitle, T.failText + " " + ORIGINS.join(", ") + why);
}

function describeFill(d, animated, url) {
  mTitle.textContent = d.name || d.fileName || "—";
  mSub.innerHTML = '<span class="badge' + (animated ? '' : ' flat') + '">'
    + (animated ? T.animated : T.still) + '</span>'
    + d.w + "×" + d.h + " · " + (d.mtype || "?")
    + ' · <a href="' + url + '" target="_blank" rel="noreferrer">' + T.open + "</a>";
}

window.addEventListener("message", e => {
  const d = e.data;
  if (!d || typeof d !== "object") return;
  if (d.type === "theme") { document.body.classList.toggle("dark", d.theme === "dark"); return; }
  if (d.type === "empty") return showHint(T.idleTitle, T.idleText);
  if (d.type === "noimage") return showHint(T.noImageTitle, d.name ? d.name + " — " + T.noImageText : T.noImageText);
  if (d.type === "error") return showHint("Error", d.message || "");
  if (d.type === "image") return showImage(d);
  if (d.type === "bytes" && pending) {          // байты пришли от фоновой части
    const p = pending; pending = null;
    p.img.dataset.src = ORIGINS[0] + "/assets/by-file-media-id/" + p.d.id;
    p.img.src = d.dataUrl;
    return;
  }
  if (d.type === "bytes-failed") { pending = null; return failed(d.message); }
});

const bFit = document.getElementById("bFit");
const bActual = document.getElementById("bActual");
function setMode(actual) {
  stage.classList.toggle("actual", actual);
  bFit.setAttribute("aria-pressed", String(!actual));
  bActual.setAttribute("aria-pressed", String(actual));
}
bFit.onclick = () => setMode(false);
bActual.onclick = () => setMode(true);
document.getElementById("bRestart").onclick = () => { if (current) showImage(current); };
</script>
</body>
</html>
